[package]
name = "clones-leash"
version = "0.1.0"
description = "A NEAR contract for agent sub-accounts that can act but never withdraw: one function-call key, bound to one market, merged home to its parent with DeleteAccount."
edition.workspace = true
license.workspace = true
repository = "https://github.com/iamrobertmoore/clones"
homepage = "https://clones-tau-nine.vercel.app"
readme = "README.md"
keywords = ["near", "agent", "smart-contract", "custody", "access-key"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**", "README.md", "Cargo.toml"]

# `cargo near build reproducible-wasm` builds in this pinned image, so anyone can rebuild the
# deployed code byte for byte and compare its hash with the chain (see .github/workflows/verify.yml).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
