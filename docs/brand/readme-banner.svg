<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Clones</title>
  <desc id="d">Copies of you trade on NEAR while you sleep. Each is a sub-account with one key: it can trade, it can never withdraw.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="60%">
      <stop offset="0" stop-color="#3a0a10" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#15060a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#07060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#d7212b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d7212b"/>
      <stop offset="1" stop-color="#d7212b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#07060a"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#2a2430"/>

  <!-- frost peaks along the bottom -->
  <path d="M0 320 L70 268 L120 296 L190 240 L250 290 L330 252 L400 300 L880 300 L950 254 L1020 292 L1090 238 L1160 290 L1220 262 L1280 300 L1280 320 Z" fill="#0d1018"/>

  <!-- spikes around the title, like the site's logo -->
  <g stroke="#ece6d9" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M430 46 L452 84 M468 34 L480 80 M506 28 L512 78 M546 30 L548 76 M600 22 L600 74 M640 18 L640 72 M680 22 L680 74 M732 30 L730 76 M772 28 L766 78 M810 34 L798 80 M850 46 L828 84" stroke-width="2.4"/>
    <path d="M448 196 L470 166 M500 204 L512 170 M556 206 L560 172 M610 210 L612 176 M668 210 L666 176 M722 206 L718 172 M780 204 L766 170 M832 196 L810 166" stroke-width="2"/>
  </g>
  <rect x="380" y="178" width="520" height="4" fill="url(#bar)"/>

  <text x="640" y="160" text-anchor="middle" fill="#ece6d9"
        font-family="UnifrakturMaguntia, 'Grenze Gotisch', 'Old English Text MT', 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="104" font-weight="700" letter-spacing="14">CLONES</text>

  <text x="640" y="236" text-anchor="middle" fill="#ece6d9"
        font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="30">
    Copies of you trade on NEAR while you sleep.
  </text>
  <text x="640" y="276" text-anchor="middle" fill="#9fb6cf"
        font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">
    Each one is a sub-account with one key: it can trade, it can <tspan fill="#ff4b55" font-style="normal" font-weight="700">never withdraw</tspan>.
  </text>
</svg>
