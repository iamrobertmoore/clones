name: topup

# Players can ring the bell and send clones in at any hour, and the house pays every guest's
# stake, so it can run dry between nightly runs. Every three hours, if the house holds less than
# MIN_NEAR, fund it from testnet's faucet. Testnet only; this job uses no secrets.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topup
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Top up the house from the testnet faucet if it runs low
        working-directory: web
        env:
          HOUSE_ACCOUNT: clonestown.testnet
          MIN_NEAR: "80"
          TOPUPS: "5"
        run: node scripts/topup.js
