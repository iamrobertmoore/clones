name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-near (builds the contract wasm for the sandbox tests)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
          cargo near --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The JavaScript rules' golden nights are current with the Rust rules
        run: cargo run -q -p clones-core --example golden | cmp - web/lib/golden.json
      - name: Unit and sandbox tests (sandbox runs real transactions on a local NEAR node)
        run: |
          set -o pipefail
          cargo test --workspace -- --test-threads=2 2>&1 | tee test.log
          if grep -E "[1-9][0-9]* ignored" test.log; then
            echo "Some tests were skipped"; exit 1
          fi
          awk '/test result:/ {n += $4} END {print n " tests passed"; if (n == 0) exit 1}' test.log

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Web tests (sign-up, night runner, rules against the Rust golden nights)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node --test 'api/*.test.js' 'lib/*.test.js'
