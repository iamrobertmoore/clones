name: town

# The hosted town's nightly bell: around 02:00 UTC it plays a night for every clone in town on NEAR
# testnet (the same code the page's "Ring the bell" button runs, web/lib/night.js), brings home
# every clone that is due, and publishes each guest's night log to the town-data branch (never
# main). Anyone can also ring the bell from the page at any time.

on:
  # Off the hour: GitHub queues top-of-the-hour schedules and has started this job hours late.
  # The later runs are backstops; each finds nothing to do if an earlier one already rang.
  schedule:
    - cron: "37 1 * * *"
    - cron: "41 2 * * *"
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: town
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install (no secrets in this step)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Top up the house from the testnet faucet if it runs low (no secrets in this step)
        working-directory: web
        env:
          HOUSE_ACCOUNT: clonestown.testnet
        run: node scripts/topup.js
      - name: Ring the bell
        working-directory: web
        env:
          HOUSE_ACCOUNT: clonestown.testnet
          HOUSE_KEY: ${{ secrets.HOUSE_KEY }}
          OUT_DIR: ${{ runner.temp }}/nights
        run: node scripts/ring.js
      - name: Publish the night logs
        env:
          NIGHTS: ${{ runner.temp }}/nights
        run: |
          if [ ! -f "$NIGHTS/index.json" ]; then echo "No night tonight."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          git config user.name "Robert Moore"
          git config user.email "iamrobertmoore@gmail.com"
          if git fetch origin town-data; then
            git switch town-data
          else
            git switch --orphan town-data
            git rm -rf --quiet . || true
          fi
          mkdir -p "nights/$day" nights/latest
          cp "$NIGHTS"/*.json "nights/$day/"
          cp "$NIGHTS"/*.json nights/latest/
          # This branch holds data, not the site: tell Vercel not to build it (the project's root is web/).
          mkdir -p web && printf '{ "git": { "deploymentEnabled": false } }\n' > web/vercel.json
          git add nights web/vercel.json
          git commit -m "Town night $day"
          git push origin town-data
