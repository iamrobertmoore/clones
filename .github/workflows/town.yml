name: town

# The hosted town's night: every day around 02:00 UTC the keeper plays one night for every clone in
# town on NEAR testnet, merges them all home at dawn, and publishes each guest's night log to the
# town-data branch (never main).

on:
  # Off the hour: GitHub queues top-of-the-hour schedules and has started this job hours late.
  # The second run is a backstop; it finds nobody to play if the first one already merged everyone.
  schedule:
    - cron: "37 1 * * *"
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: town
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the keeper (no secrets in this step)
        run: cargo build --release -p clones-replay --bin keeper
      - name: Play tonight
        env:
          HOUSE_ACCOUNT: clonestown.testnet
          HOUSE_KEY: ${{ secrets.HOUSE_KEY }}
          OUT_DIR: ${{ runner.temp }}/nights
        run: ./target/release/keeper
      - name: Publish the night logs
        env:
          NIGHTS: ${{ runner.temp }}/nights
        run: |
          if [ ! -f "$NIGHTS/index.json" ]; then echo "No night tonight."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          git config user.name "Robert Moore"
          git config user.email "iamrobertmoore@gmail.com"
          if git fetch origin town-data; then
            git switch town-data
          else
            git switch --orphan town-data
            git rm -rf --quiet . || true
          fi
          mkdir -p "nights/$day" nights/latest
          cp "$NIGHTS"/*.json "nights/$day/"
          cp "$NIGHTS"/*.json nights/latest/
          git add nights
          git commit -m "Town night $day"
          git push origin town-data
